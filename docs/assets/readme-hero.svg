    <text x="58" y="51" font-family="Inter, ui-sans-serif, system-ui" font-size="13" fill="#667085">Daily streak</text>
  </g>

  <g transform="translate(650 502)" opacity="0.9">
    <rect x="0" y="38" width="40" height="34" rx="8" fill="#D9E8FF"/>
    <rect x="58" y="18" width="40" height="54" rx="8" fill="#A9CEFF"/>
    <rect x="116" y="0" width="40" height="72" rx="8" fill="#4A90D9"/>
