  </g>

  <g transform="translate(960 392)">
    <rect x="0" y="0" width="152" height="72" rx="18" fill="#FFFFFF" stroke="#E4E9F2"/>
    <text x="24" y="31" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="24">⏱️</text>
