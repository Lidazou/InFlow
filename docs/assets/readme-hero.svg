<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">InFlow hero artwork</title>
  <desc id="desc">White background banner with InFlow wordmark and app feature illustrations.</desc>
  <rect width="1280" height="640" rx="40" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1200" height="560" rx="32" fill="#FBFCFF" stroke="#E9EEF7"/>

  <circle cx="110" cy="118" r="18" fill="#FF6B6B"/>
  <circle cx="160" cy="118" r="18" fill="#4A90D9"/>
  <circle cx="210" cy="118" r="18" fill="#78D6A3"/>

  <g filter="url(#softShadow)">
    <rect x="104" y="168" width="428" height="320" rx="28" fill="#0A0A0F"/>
    <path d="M104 258C176 210 245 302 317 248C384 198 445 220 532 168V488H104V258Z" fill="url(#aurora)" opacity="0.92"/>
    <circle cx="318" cy="320" r="110" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="318" cy="320" r="70" fill="#FFFFFF" opacity="0.1"/>
    <text x="318" y="342" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="92">✨</text>
    <text x="318" y="430" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">Long press. Feel. Release.</text>
  </g>

  <text x="608" y="235" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="104" font-weight="850" fill="#101828" letter-spacing="0">InFlow</text>
  <text x="612" y="292" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="560" fill="#344054">Track your every InFlow moment</text>
  <text x="612" y="348" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="450" fill="#667085">Emotion journaling, diet awareness, and study check-ins in one quiet MVP.</text>

  <g transform="translate(612 392)">
