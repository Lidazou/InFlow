    <text x="58" y="29" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700" fill="#101828">Emotion</text>
    <text x="58" y="51" font-family="Inter, ui-sans-serif, system-ui" font-size="13" fill="#667085">0-100 flow</text>
  </g>

  <g transform="translate(786 392)">
    <rect x="0" y="0" width="152" height="72" rx="18" fill="#FFFFFF" stroke="#E4E9F2"/>
    <text x="24" y="31" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="24">🥗</text>
    <text x="58" y="29" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700" fill="#101828">Diet</text>
