      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#101828" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="aurora" x1="104" y1="168" x2="538" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A90D9"/>
      <stop offset="0.48" stop-color="#8B5CF6"/>
